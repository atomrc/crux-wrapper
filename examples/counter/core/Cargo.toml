[package]
name = "core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "core"

[[bin]]
name = "crux_cli"
required-features = ["cli"]

[features]
cli = ["crux_core/cli", "facet_typegen"]
facet_typegen = ["crux_core/facet_typegen"]

[dependencies]
crux_core = "0.17.0-rc2"
serde = { version = "1.0.228", features = ["derive"] }
futures-util = "0.3.31"
facet = { version = "0.31.8" }
uniffi = "0.29.4"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.108"
