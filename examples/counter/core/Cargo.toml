[package]
name = "core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "core"

[[bin]]
name = "crux_cli"
required-features = ["cli"]

[features]
cli = ["crux_core/cli", "facet_typegen"]
facet_typegen = ["crux_core/facet_typegen"]

[dependencies]
crux_core = "0.17.0-rc2"
serde = { version = "1.0.218", features = ["derive"] }
lazy_static = "1.5.0"
uniffi = "0.29.0"
serde_bytes = "0.11.17"
futures-util = "0.3.31"
facet = { version = "=0.28", features = ["chrono"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.100"

[target.uniffi-bindgen.dependencies]
uniffi = { version = "0.29.0", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.29.0", features = ["build"] }
